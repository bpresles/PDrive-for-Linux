# Release on a version tag (v*), or on manual run (bump patch/minor/major): native libraries,
# vendored source archive, RPM, DEB, AppImage (x86_64 and aarch64) and Arch package (x86_64), SHA-256 sums, GitHub release, optional
# COPR submission. The tag must match Cargo.toml (workspace.package.version),
# packaging/rpm/pdrive-for-linux.spec, packaging/arch/PKGBUILD and debian/changelog, else the run
# fails at the first job.
#
# Manual run (Actions > release > Run workflow, on the default branch): the "bump" job raises the
# version (scripts/bump-version.sh), commits it, creates the tag and pushes both, then the same
# jobs release that tag. The tag is pushed with GITHUB_TOKEN, and GitHub starts no workflow for
# events created with that token: the tag trigger below does not fire a second run. Keep it so
# (no PAT or deploy key in the bump job), or the release would run twice.
# If the run then fails before the GitHub release is done, the "rollback" job deletes the tag and
# any draft release of it, and reverts the bump commit (a new revert commit, no force push).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Version increase (X.Y.Z -> patch X.Y.Z+1, minor X.Y+1.0, major X+1.0.0); commits, tags and releases
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
  # Manual run only: version bump commit + tag. Skipped on a tag push.
  bump:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the commit and the tag
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - name: Default branch only
        if: ${{ github.ref_name != github.event.repository.default_branch }}
        run: |
          echo "::error::Run this workflow on ${{ github.event.repository.default_branch }}, not ${{ github.ref_name }}"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version=$(scripts/bump-version.sh "$BUMP")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists"; exit 1
          fi
          scripts/check-version.sh "$tag"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -a -m "chore(release): Increase version to $version"
          git tag -a "$tag" -m "PDrive for Linux $version"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME" "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    needs: bump
    # Runs after the bump of a manual run, or alone on a tag push (bump skipped).
    if: ${{ !cancelled() && (needs.bump.result == 'success' || needs.bump.result == 'skipped') }}
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      native_id: ${{ steps.v.outputs.native_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.tag || github.ref_name }}
      - id: v
        env:
          TAG: ${{ needs.bump.outputs.tag || github.ref_name }}
        run: |
          scripts/check-version.sh "$TAG"
          source scripts/lib-version.sh
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "native_id=$NATIVE_ID" >> "$GITHUB_OUTPUT"

  # The native libraries cannot be cross-compiled (NativeAOT): one build per architecture, on a
  # runner of that architecture, in parallel. Each architecture packages as soon as its own
  # libraries are ready (it does not wait for the other one). The source archive is architecture
  # independent: built once, in parallel with the native builds.
  native-x64:
    needs: check
    uses: ./.github/workflows/native.yml
    with: { tag: "${{ needs.check.outputs.tag }}", arch: x64, runner: ubuntu-24.04 }

  native-arm64:
    needs: check
    uses: ./.github/workflows/native.yml
    with: { tag: "${{ needs.check.outputs.tag }}", arch: arm64, runner: ubuntu-24.04-arm }

  # Project files + vendored Rust crates (see scripts/make-source-tarball.sh).
  source:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.tag }}
      - run: |
          rustup toolchain install stable --profile minimal
          scripts/make-source-tarball.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: dist/pdrive-for-linux-*
          if-no-files-found: error

  package-x64:
    needs: [check, native-x64, source]
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
      native_id: ${{ needs.check.outputs.native_id }}
      arch: x64
      runner: ubuntu-24.04

  package-arm64:
    needs: [check, native-arm64, source]
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
      native_id: ${{ needs.check.outputs.native_id }}
      arch: arm64
      runner: ubuntu-24.04-arm

  release:
    needs: [check, source, package-x64, package-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release or upload to it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: out, merge-multiple: true }
      - name: SHA-256 sums
        working-directory: out
        run: |
          rm -f *.sha256
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # A release for the tag may already exist (published by hand, or a draft from an earlier run):
      # then only the files are uploaded, title, notes and state stay untouched. A draft is not
      # reachable by tag through the API, so the releases are listed and filtered on tag_name.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          existing=$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.tag_name == env.TAG) | [.draft, .id] | @tsv' | sort | head -n 1)
          if [ -n "$existing" ]; then
            echo "Release for $TAG exists (draft/id: $existing): uploading the files"
            gh release upload "$TAG" --clobber out/*
          else
            gh release create "$TAG" --verify-tag --draft \
              --title "PDrive for Linux ${TAG#v}" \
              --notes "Unofficial client, not affiliated with Proton AG. Verify the files with SHA256SUMS. Draft: review, then publish." \
              out/*
          fi

  # Manual run whose release did not complete: undo the bump so that the version is not skipped.
  # Not run when the release job succeeded (the draft release then points at the tag); a later
  # copr failure does not undo anything.
  rollback:
    needs: [bump, check, native-x64, native-arm64, source, package-x64, package-arm64, release]
    if: ${{ always() && needs.bump.result == 'success' && needs.release.result != 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # delete the tag and the draft release, push the revert
    env:
      TAG: ${{ needs.bump.outputs.tag }}
      SHA: ${{ needs.bump.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Delete the tag and its draft release
        run: |
          # Only drafts: a published release is left alone.
          gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.tag_name == env.TAG and .draft) | .id' |
            while read -r id; do gh api -X DELETE "repos/$GH_REPO/releases/$id"; done
          git push origin ":refs/tags/$TAG" || echo "Tag $TAG already gone"
      - name: Revert the bump commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit "$SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

  # Optional: set the repository variable COPR_PROJECT (owner/project) and the secret COPR_CONFIG
  # (content of the copr-cli config file). Skipped otherwise.
  copr:
    needs: [check, release]
    if: ${{ vars.COPR_PROJECT != '' }}
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: rpm-x64, path: rpm }
      - name: Submit the SRPM
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT }}
        run: |
          dnf -y install copr-cli
          install -d -m 700 ~/.config
          (umask 077; printf '%s\n' "$COPR_CONFIG" > ~/.config/copr)
          copr-cli build --nowait "$COPR_PROJECT" rpm/*.src.rpm
