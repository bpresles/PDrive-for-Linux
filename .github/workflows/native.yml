# Called by release.yml, once per architecture: native libraries (.NET 10 NativeAOT + Rust at the
# revisions pinned in scripts/build-native.sh), packed as pdrive-native-linux-<arch>-<id>.tar.xz.
# Needs a runner of the target architecture: the NativeAOT build does not cross-compile.
name: native
on:
  workflow_call:
    inputs:
      tag: { type: string, required: true }
      arch: { description: x64 or arm64, type: string, required: true }
      runner: { description: runner label of that architecture, type: string, required: true }
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      # The script detects the architecture of the runner (scripts/lib-arch.sh).
      - name: Build native libraries
        run: |
          rustup toolchain install stable --profile minimal
          scripts/build-native.sh
      - run: scripts/package-native.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ inputs.arch }}
          path: dist/pdrive-native-linux-${{ inputs.arch }}-*
          if-no-files-found: error
