# Called by release.yml, once per architecture: RPM, DEB, AppImage and Arch package from
# the native archive of that architecture and the shared source archive. The four jobs run in
# parallel on a runner of the target architecture.
name: package
on:
  workflow_call:
    inputs:
      tag: { type: string, required: true }
      version: { type: string, required: true }
      native_id: { type: string, required: true }
      arch: { description: x64 or arm64, type: string, required: true }
      runner: { description: runner label of that architecture, type: string, required: true }
permissions:
  contents: read
env:
  VERSION: ${{ inputs.version }}
  RID: linux-${{ inputs.arch }}
  APPIMAGE_ARCH: ${{ inputs.arch == 'arm64' && 'aarch64' || 'x86_64' }}
  NATIVE_ARCHIVE: pdrive-native-linux-${{ inputs.arch }}-${{ inputs.native_id }}.tar.xz
jobs:
  rpm:
    runs-on: ${{ inputs.runner }}
    container: registry.fedoraproject.org/fedora:45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "native-${{ inputs.arch }}", path: dist }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: source, path: dist }
      - run: ln -s "$PWD/dist" /dist && bash scripts/container/build-rpm.sh
      # The SRPM is the same on every architecture except for its native archive: x64 only.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-${{ inputs.arch }}
          path: |
            dist/*.rpm
            !dist/*-debuginfo-*.rpm
            !dist/*-debugsource-*.rpm
            ${{ inputs.arch != 'x64' && '!dist/*.src.rpm' || '' }}
          if-no-files-found: error

  deb:
    runs-on: ${{ inputs.runner }}
    # Debian 13 ships rustc 1.85 (< 1.92 required by the dependencies): the script falls back to rustup.
    container: docker.io/library/debian:trixie
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "native-${{ inputs.arch }}", path: dist }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: source, path: dist }
      - run: ln -s "$PWD/dist" /dist && bash scripts/container/build-deb.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ inputs.arch }}
          path: dist/*.deb
          if-no-files-found: error

  arch:
    if: ${{ inputs.arch == 'x64' }}
    runs-on: ${{ inputs.runner }}
    container: docker.io/library/archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "native-${{ inputs.arch }}", path: dist }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: source, path: dist }
      - run: ln -s "$PWD/dist" /dist && bash scripts/container/build-arch.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-${{ inputs.arch }}
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  # The official archlinux image is x86_64 only. On arm64 the build runs in a container made from
  # the Arch Linux ARM root filesystem (os.archlinuxarm.org), whose signature is checked against the
  # build key pinned in packaging/arch/ (fingerprint below).
  arch-arm64:
    if: ${{ inputs.arch == 'arm64' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "native-${{ inputs.arch }}", path: dist }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: source, path: dist }
      - name: Arch Linux ARM container image
        env:
          ALARM_KEY_FPR: 68B3537F39A313B3E574D06777193F152BDBE6A6
        run: |
          url=http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          work=$(mktemp -d)
          curl --proto '=https,http' -fsSL --retry 3 -o "$work/rootfs.tar.gz" "$url"
          curl --proto '=https,http' -fsSL --retry 3 -o "$work/rootfs.tar.gz.sig" "$url.sig"
          export GNUPGHOME="$work/gnupg"; install -d -m 700 "$GNUPGHOME"
          gpg --batch --import packaging/arch/archlinuxarm-build-key.asc
          # The pinned key must be the expected one, and the signature must come from it.
          fprs=$(gpg --batch --with-colons --fingerprint | awk -F: '$1=="fpr"{print $10}')
          grep -qx "$ALARM_KEY_FPR" <<<"$fprs"
          status=$(gpg --batch --status-fd 1 --verify "$work/rootfs.tar.gz.sig" "$work/rootfs.tar.gz" 2>/dev/null)
          grep -q "VALIDSIG $ALARM_KEY_FPR " <<<"$status"
          docker import "$work/rootfs.tar.gz" alarm
          rm -rf "$work"
      # The sandbox of pacman (Landlock) is not available in a container.
      - name: Build
        run: |
          docker run --rm -v "$PWD":/src -v "$PWD/dist":/dist -w /src -e VERSION -e NATIVE_ARCHIVE alarm bash -c '
            set -euo pipefail
            sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
            pacman-key --init && pacman-key --populate archlinuxarm
            bash scripts/container/build-arch.sh'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-${{ inputs.arch }}
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  appimage:
    runs-on: ${{ inputs.runner }}
    # Same Debian 13 base as the DEB (libadwaita >= 1.6): the AppImage needs glibc >= 2.41.
    container: docker.io/library/debian:trixie
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "native-${{ inputs.arch }}", path: dist }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: source, path: dist }
      - run: ln -s "$PWD/dist" /dist && bash scripts/container/build-appimage.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-${{ inputs.arch }}
          path: dist/*.AppImage
          if-no-files-found: error
